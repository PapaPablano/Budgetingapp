<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Cash Flow Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --text: #1c1917;
      --text-muted: #78716c;
      --border: #e7e5e4;
      --income: #15803d;
      --income-bg: #f0fdf4;
      --bills: #b45309;
      --bills-bg: #fffbeb;
      --positive: #15803d;
      --positive-bg: #dcfce7;
      --negative: #b91c1c;
      --negative-bg: #fee2e2;
      --accent: #2563eb;
      --radius: 8px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 540px) {
      .summary { grid-template-columns: 1fr; }
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .summary-card .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .summary-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .summary-card.income .value { color: var(--income); }
    .summary-card.bills .value { color: var(--bills); }

    .summary-card.remaining {
      border-width: 2px;
    }

    .summary-card.remaining.positive {
      background: var(--positive-bg);
      border-color: var(--positive);
    }

    .summary-card.remaining.positive .value { color: var(--positive); }

    .summary-card.remaining.negative {
      background: var(--negative-bg);
      border-color: var(--negative);
    }

    .summary-card.remaining.negative .value { color: var(--negative); }

    .summary-card.income.awaiting .value,
    .summary-card.remaining.awaiting .value {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .summary-card.remaining.awaiting {
      background: var(--bg);
      border-color: var(--border);
    }

    .trend-strip {
      margin-bottom: 1.5rem;
    }

    .trend-strip .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .trend-strip svg {
      display: block;
      width: 100%;
      height: 70px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Monthly Cash Flow Planner</h1>
      <p id="month-context"></p>
      <p>
        <a href="allocator.html" style="font-size: 0.85rem; color: var(--text-muted);">Paycheck Allocator &rarr;</a>
        &middot;
        <button type="button" id="export-btn" style="font: inherit; font-size: 0.85rem; color: var(--text-muted); background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline;">Export data</button>
      </p>
    </header>

    <div class="summary">
      <div class="summary-card income" id="income-card">
        <div class="label">Total Income</div>
        <div class="value" id="total-income">$0.00</div>
      </div>
      <div class="summary-card bills">
        <div class="label">Total Bills</div>
        <div class="value" id="total-bills">$0.00</div>
      </div>
      <div class="summary-card remaining positive" id="remaining-card">
        <div class="label">Remaining</div>
        <div class="value" id="remaining">$0.00</div>
      </div>
    </div>

    <div id="trend-strip-mount"></div>
  </div>

  <script src="chart.js"></script>
  <script>
    const STORAGE_KEY = 'budget-v1';
    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    const currency = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD'
    });

    function defaultState() {
      return { paydays: { p1: 1, p2: 15 }, goals: [], bills: [], categories: [], months: {}, currentMonthKey: null, summary: null, history: {} };
    }

    // Read-only mirror of allocator.html's shared schema. index.html never calls
    // localStorage.setItem — allocator.html is the sole writer to budget-v1.
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return {
          paydays: parsed.paydays && typeof parsed.paydays === 'object' ? parsed.paydays : { p1: 1, p2: 15 },
          goals: Array.isArray(parsed.goals) ? parsed.goals : [],
          bills: Array.isArray(parsed.bills) ? parsed.bills : [],
          categories: Array.isArray(parsed.categories) ? parsed.categories : [],
          months: parsed.months && typeof parsed.months === 'object' ? parsed.months : {},
          currentMonthKey: typeof parsed.currentMonthKey === 'string' ? parsed.currentMonthKey : null,
          summary: parsed.summary && typeof parsed.summary === 'object' ? parsed.summary : null,
          history: parsed.history && typeof parsed.history === 'object' ? parsed.history : {}
        };
      } catch {
        return defaultState();
      }
    }

    function getCurrentMonthKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function getMonthLabel(monthKey) {
      if (!monthKey) return '';
      const [y, m] = monthKey.split('-').map(Number);
      return `${MONTH_NAMES[m - 1]} ${y}`;
    }

    function getDaysRemaining() {
      const now = new Date();
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      return lastDay - now.getDate();
    }

    const state = loadState();

    const monthContext = document.getElementById('month-context');
    const incomeCard = document.getElementById('income-card');
    const totalIncomeEl = document.getElementById('total-income');
    const totalBillsEl = document.getElementById('total-bills');
    const remainingEl = document.getElementById('remaining');
    const remainingCard = document.getElementById('remaining-card');

    function renderHeader() {
      const monthLabel = getMonthLabel(state.currentMonthKey);
      if (!monthLabel) {
        monthContext.textContent = 'No data yet — add bills and income on the Paycheck Allocator to get started.';
        return;
      }
      if (state.currentMonthKey === getCurrentMonthKey()) {
        const days = getDaysRemaining();
        const dayWord = days === 1 ? 'day' : 'days';
        monthContext.textContent = `Planning for ${monthLabel} — ${days} ${dayWord} left in the month`;
      } else {
        monthContext.textContent = `Planning for ${monthLabel}`;
      }
    }

    function renderSummary() {
      const summary = state.summary;
      // Treat a missing/malformed summary the same as "awaiting" rather than formatting
      // undefined figures -- guards against a legacy or corrupted budget-v1 value, not just
      // the genuine awaiting-income case.
      const hasFigures = summary && summary.status !== 'awaiting'
        && typeof summary.totalIncome === 'number' && typeof summary.remaining === 'number';
      const awaitingIncome = !hasFigures;
      const totalBills = summary && typeof summary.totalBills === 'number' ? summary.totalBills : 0;

      totalIncomeEl.textContent = awaitingIncome ? 'Awaiting income' : currency.format(summary.totalIncome);
      totalBillsEl.textContent = currency.format(totalBills);
      remainingEl.textContent = awaitingIncome ? 'Awaiting income' : currency.format(summary.remaining);

      incomeCard.classList.toggle('awaiting', awaitingIncome);
      remainingCard.classList.remove('positive', 'negative', 'awaiting');
      remainingCard.classList.add(awaitingIncome ? 'awaiting' : (summary.remaining >= 0 ? 'positive' : 'negative'));
    }

    const TREND_STRIP_MAX_MONTHS = 6;

    function renderTrendStrip() {
      const mount = document.getElementById('trend-strip-mount');
      const history = state.history || {};
      // Guard against a missing/malformed entry, matching renderSummary()'s existing
      // defensive convention for corrupted persisted data.
      const monthKeys = Object.keys(history)
        .filter((mk) => history[mk] && typeof history[mk] === 'object' && typeof history[mk].status === 'string')
        .sort()
        .slice(-TREND_STRIP_MAX_MONTHS);

      if (monthKeys.length === 0) {
        mount.innerHTML = '';
        return;
      }

      const styles = getComputedStyle(document.documentElement);
      const colorPositive = styles.getPropertyValue('--positive').trim();
      const colorNegative = styles.getPropertyValue('--negative').trim();
      const colorNeutral = styles.getPropertyValue('--text-muted').trim();

      const points = monthKeys.map((mk) => {
        const entry = history[mk];
        const monthLabel = getMonthLabel(mk);
        if (entry.status === 'awaiting' || typeof entry.remaining !== 'number') {
          return { value: null, color: colorNeutral, label: `${monthLabel}: Awaiting income` };
        }
        return {
          value: entry.remaining,
          color: entry.remaining >= 0 ? colorPositive : colorNegative,
          label: `${monthLabel}: ${currency.format(entry.remaining)}`
        };
      });

      const monthWord = monthKeys.length === 1 ? 'month' : 'months';
      const ariaLabel = `Remaining, last ${monthKeys.length} ${monthWord}`;
      const svg = sparkline(points, { width: 600, height: 70, pointRadius: 4, ariaLabel });

      mount.innerHTML = `<div class="trend-strip"><div class="label">Remaining, last ${monthKeys.length} ${monthWord}</div>${svg}</div>`;
    }

    function render() {
      renderHeader();
      renderSummary();
      renderTrendStrip();
    }

    function exportData() {
      const envelope = {
        exportedAt: new Date().toISOString(),
        source: 'index.html',
        version: 1,
        data: state
      };
      const blob = new Blob([JSON.stringify(envelope, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'cashflow-planner-export.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    document.getElementById('export-btn').addEventListener('click', exportData);

    render();
  </script>
</body>
</html>
