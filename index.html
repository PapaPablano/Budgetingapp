<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Cash Flow Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #f5f5f4;
      --surface: #ffffff;
      --text: #1c1917;
      --text-muted: #78716c;
      --border: #e7e5e4;
      --income: #15803d;
      --income-bg: #f0fdf4;
      --bills: #b45309;
      --bills-bg: #fffbeb;
      --positive: #15803d;
      --positive-bg: #dcfce7;
      --negative: #b91c1c;
      --negative-bg: #fee2e2;
      --accent: #2563eb;
      --radius: 8px;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 540px) {
      .summary { grid-template-columns: 1fr; }
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .summary-card .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .summary-card .value {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .summary-card.income .value { color: var(--income); }
    .summary-card.bills .value { color: var(--bills); }

    .summary-card.remaining {
      border-width: 2px;
    }

    .summary-card.remaining.positive {
      background: var(--positive-bg);
      border-color: var(--positive);
    }

    .summary-card.remaining.positive .value { color: var(--positive); }

    .summary-card.remaining.negative {
      background: var(--negative-bg);
      border-color: var(--negative);
    }

    .summary-card.remaining.negative .value { color: var(--negative); }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .section-header.income { background: var(--income-bg); color: var(--income); }
    .section-header.bills { background: var(--bills-bg); color: var(--bills); }

    .entry-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .entry-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    .entry-row:last-child { border-bottom: none; }

    .entry-label {
      flex: 1;
      min-width: 0;
      padding: 0.35rem 0.5rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 0.95rem;
      background: transparent;
      color: var(--text);
    }

    .entry-label:hover,
    .entry-label:focus {
      border-color: var(--border);
      background: var(--bg);
      outline: none;
    }

    .entry-amount {
      width: 7rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 0.95rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      background: transparent;
      color: var(--text);
    }

    .entry-amount:hover,
    .entry-amount:focus {
      border-color: var(--border);
      background: var(--bg);
      outline: none;
    }

    .btn-delete {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-delete:hover {
      background: var(--negative-bg);
      color: var(--negative);
    }

    .add-form {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    .add-form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .add-form input[type="number"] {
      width: 7rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.95rem;
      text-align: right;
    }

    .add-form button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      background: var(--accent);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-form button:hover { opacity: 0.9; }

    .empty-hint {
      padding: 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Monthly Cash Flow Planner</h1>
      <p id="month-context"></p>
      <p><a href="allocator.html" style="font-size: 0.85rem; color: var(--text-muted);">Paycheck Allocator &rarr;</a></p>
    </header>

    <div class="summary">
      <div class="summary-card income">
        <div class="label">Total Income</div>
        <div class="value" id="total-income">$0.00</div>
      </div>
      <div class="summary-card bills">
        <div class="label">Total Bills</div>
        <div class="value" id="total-bills">$0.00</div>
      </div>
      <div class="summary-card remaining positive" id="remaining-card">
        <div class="label">Remaining</div>
        <div class="value" id="remaining">$0.00</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header income">Income</div>
      <ul class="entry-list" id="income-list"></ul>
      <form class="add-form" id="income-form">
        <input type="text" id="income-label" placeholder="Description" autocomplete="off">
        <input type="number" id="income-amount" placeholder="0.00" min="0" step="0.01" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </div>

    <div class="section">
      <div class="section-header bills">Bills</div>
      <ul class="entry-list" id="bills-list"></ul>
      <form class="add-form" id="bills-form">
        <input type="text" id="bills-label" placeholder="Description" autocomplete="off">
        <input type="number" id="bills-amount" placeholder="0.00" min="0" step="0.01" autocomplete="off">
        <button type="submit">Add</button>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'budgetPlanner-v1';

    const currency = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD'
    });

    function getCurrentMonth() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      return `${year}-${month}`;
    }

    function getMonthLabel() {
      const now = new Date();
      return now.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function getDaysRemaining() {
      const now = new Date();
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      return lastDay - now.getDate();
    }

    function generateId() {
      return crypto.randomUUID();
    }

    function createEmptyState() {
      return {
        month: getCurrentMonth(),
        income: [],
        bills: []
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createEmptyState();

        const parsed = JSON.parse(raw);
        const currentMonth = getCurrentMonth();

        if (parsed.month !== currentMonth) {
          const carryForward = confirm(
            `Your saved data is from ${parsed.month}. Start fresh for ${getMonthLabel()}, or keep your existing entries?`
          );
          if (carryForward) {
            return {
              month: currentMonth,
              income: parsed.income || [],
              bills: parsed.bills || []
            };
          }
          return createEmptyState();
        }

        return {
          month: currentMonth,
          income: parsed.income || [],
          bills: parsed.bills || []
        };
      } catch {
        return createEmptyState();
      }
    }

    function saveState(state) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function parseAmount(value) {
      const num = parseFloat(value);
      if (isNaN(num) || num < 0) return 0;
      return Math.round(num * 100) / 100;
    }

    function sumEntries(entries) {
      return entries.reduce((total, entry) => total + (entry.amount || 0), 0);
    }

    let state = loadState();

    const monthContext = document.getElementById('month-context');
    const totalIncomeEl = document.getElementById('total-income');
    const totalBillsEl = document.getElementById('total-bills');
    const remainingEl = document.getElementById('remaining');
    const remainingCard = document.getElementById('remaining-card');
    const incomeList = document.getElementById('income-list');
    const billsList = document.getElementById('bills-list');

    function renderHeader() {
      const days = getDaysRemaining();
      const dayWord = days === 1 ? 'day' : 'days';
      monthContext.textContent = `Planning for ${getMonthLabel()} — ${days} ${dayWord} left in the month`;
    }

    function renderSummary() {
      const totalIncome = sumEntries(state.income);
      const totalBills = sumEntries(state.bills);
      const remaining = totalIncome - totalBills;

      totalIncomeEl.textContent = currency.format(totalIncome);
      totalBillsEl.textContent = currency.format(totalBills);
      remainingEl.textContent = currency.format(remaining);

      remainingCard.classList.remove('positive', 'negative');
      remainingCard.classList.add(remaining >= 0 ? 'positive' : 'negative');
    }

    function renderEntryRow(entry, type) {
      const li = document.createElement('li');
      li.className = 'entry-row';
      li.dataset.id = entry.id;
      li.dataset.type = type;

      const labelInput = document.createElement('input');
      labelInput.type = 'text';
      labelInput.className = 'entry-label';
      labelInput.value = entry.label;
      labelInput.addEventListener('blur', () => updateEntry(type, entry.id, 'label', labelInput.value));
      labelInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') labelInput.blur();
      });

      const amountInput = document.createElement('input');
      amountInput.type = 'number';
      amountInput.className = 'entry-amount';
      amountInput.min = '0';
      amountInput.step = '0.01';
      amountInput.value = entry.amount;
      amountInput.addEventListener('blur', () => updateEntry(type, entry.id, 'amount', amountInput.value));
      amountInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') amountInput.blur();
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'btn-delete';
      deleteBtn.setAttribute('aria-label', 'Delete entry');
      deleteBtn.textContent = '×';
      deleteBtn.addEventListener('click', () => deleteEntry(type, entry.id));

      li.appendChild(labelInput);
      li.appendChild(amountInput);
      li.appendChild(deleteBtn);
      return li;
    }

    function renderList(listEl, entries, type) {
      listEl.innerHTML = '';
      if (entries.length === 0) {
        const hint = document.createElement('li');
        hint.className = 'empty-hint';
        hint.textContent = type === 'income' ? 'No income added yet' : 'No bills added yet';
        listEl.appendChild(hint);
        return;
      }
      entries.forEach(entry => listEl.appendChild(renderEntryRow(entry, type)));
    }

    function render() {
      renderHeader();
      renderList(incomeList, state.income, 'income');
      renderList(billsList, state.bills, 'bills');
      renderSummary();
    }

    function updateEntry(type, id, field, value) {
      const entries = state[type];
      const entry = entries.find(e => e.id === id);
      if (!entry) return;

      if (field === 'label') {
        entry.label = value.trim() || 'Untitled';
      } else if (field === 'amount') {
        entry.amount = parseAmount(value);
      }

      saveState(state);
      renderSummary();
    }

    function deleteEntry(type, id) {
      state[type] = state[type].filter(e => e.id !== id);
      saveState(state);
      render();
    }

    function addEntry(type, label, amount) {
      const parsed = parseAmount(amount);
      if (parsed <= 0) return false;

      state[type].push({
        id: generateId(),
        label: label.trim() || 'Untitled',
        amount: parsed
      });

      saveState(state);
      render();
      return true;
    }

    document.getElementById('income-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const labelInput = document.getElementById('income-label');
      const amountInput = document.getElementById('income-amount');
      if (addEntry('income', labelInput.value, amountInput.value)) {
        labelInput.value = '';
        amountInput.value = '';
        labelInput.focus();
      }
    });

    document.getElementById('bills-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const labelInput = document.getElementById('bills-label');
      const amountInput = document.getElementById('bills-amount');
      if (addEntry('bills', labelInput.value, amountInput.value)) {
        labelInput.value = '';
        amountInput.value = '';
        labelInput.focus();
      }
    });

    render();
  </script>
</body>
</html>
